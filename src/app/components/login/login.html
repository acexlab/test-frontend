<div class="container">

    <div class="card">

        <h2>Login</h2>

        <input
            type="email"
            placeholder="Email"
            [(ngModel)]="loginData.email">

        <input
            type="password"
            placeholder="Password"
            [(ngModel)]="loginData.password">

        <button (click)="login()">
            Login
        </button>

        <p>
            Don't have an account?

            <a routerLink="/register">
                Register
            </a>
        </p>

    </div>

</div>
